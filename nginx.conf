server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, so nginx starts even if auth/backend are not running yet
    resolver 127.0.0.11 valid=30s;

    location /auth-api/ {
        set $auth http://capstone-auth:3000;
        rewrite ^/auth-api/(.*)$ /$1 break;
        proxy_pass $auth;
    }

    location /trading-api/ {
        set $trading http://capstone-backend:8081;
        rewrite ^/trading-api/(.*)$ /$1 break;
        proxy_pass $trading;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
