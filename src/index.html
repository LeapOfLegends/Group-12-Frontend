<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JetZy Trading</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="JetZy Trading - a direct trading platform for self-directed investors."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#073B2A" />
    <link rel="icon" type="image/png" href="jetzy-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong colours. Light
      // unless dark was saved, exactly like ThemeService, which would otherwise flip an OS-dark
      // first visit back to light once the app boots.
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('jetzy.theme') === 'dark') {
            theme = 'dark';
          }
        } catch (e) {
          /* storage unavailable: ThemeService falls back to light as well */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
